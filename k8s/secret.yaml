# Database credentials, kept out of the Deployment manifests.
# Note: a Secret is only base64-encoded, not encrypted. It is fine for this
# Minikube project; in production use encryption at rest / an external vault
# and never commit real passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: default
  labels:
    app: flask-crud-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: cruddb
  MYSQL_USER: cruduser
  MYSQL_PASSWORD: crudpassword
